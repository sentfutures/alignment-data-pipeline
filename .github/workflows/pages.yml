name: pages

# Publishes report/index.html to GitHub Pages (reasoning.sentientfutures.ai)
# whenever main changes it. The custom domain lives in the repo's Pages
# settings, not here.

on:
  push:
    branches: [main]
    paths:
      - report/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the report as the site root
        run: |
          mkdir -p _site
          cp report/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
