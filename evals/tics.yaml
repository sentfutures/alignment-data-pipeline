# Tracked tics (watchlist) + ignore-list for the DAD phrase-tic audit
# (evals/audit_dad.py). "Tracked tics" are confirmed recurring phrases the audit
# counts every run; the ignore-list is dismissed candidates.
#
# WHY A DATA FILE: the audit counts these every run, and the review workflow
# (evals/review_tics.py) appends to them — keeping them out of Python source so
# a review can promote/dismiss a candidate without editing code.
#
# THE LOOP: each audit run writes candidate phrases to
# <run>/audit/tic_candidates.jsonl (rare-in-English AND over-represented, per
# the wordfreq screen). `review_tics.py list` aggregates those across committed
# runs and shows the ones NOT already here; a human (via Claude Code) then runs
# `review_tics.py promote <phrase> --family <f>` or `... ignore <phrase>`, which
# appends below. Promoted phrases get counted every run; ignored ones stop being
# surfaced.
#
# origin: "pipeline-origin" = a tic the pipeline produces (the training-data
# signal); "plain-origin" = a tic plain Claude has too (inherited, tracked for
# contrast). family is a free-text grouping shown during review.
#
# surface: WHERE a phrase is watched — "response" (the assistant replies; the
# default, and what every phrase promoted before 2026-07-25 was promoted for)
# or "prompt" (the user messages step 1 writes). Both surfaces are pipeline
# output that lands in the training records, so the audit counts EVERY watched
# phrase on both; `surface` says which one the phrase was promoted for and
# which chart it belongs to, not which one it may appear in.
#
# SCOPE vs the rhetorical-moves map (evals/moves.yaml): tracked tics are for
# distinctive PHRASE engrams — a specific string recurring verbatim. Recurring
# ARGUMENT MOVES (the autonomy coda, "cuts both ways", unbundling, …) are now
# tracked as moves instead, so their phrasings live in the ignore-list here to
# avoid double-counting and to stop the candidate queue re-surfacing them.

watch:
  pipeline-origin:
    # Demoted 2026-07-27 (zero pipeline hits on the first Opus 5 run,
    # opus5-smoke-40 — 4.8-era habits the new model dropped): "straight with
    # you", "be honest about", "gut check", "my honest read", "the welfare
    # question", "why this matters". Deliberately NOT ignore-listed, so the
    # candidate screen re-surfaces any of them if a later model brings them
    # back.
    #
    # Demoted 2026-07-30 on the archetype200 run (n=179 pipeline / 187 plain) —
    # under 5% of responses in BOTH arms, which is also the floor below which
    # the viewer stops charting a phrase: "genuinely yours" (2.2/0.0),
    # "cuts both ways" (3.4/1.1), "overthinking" (2.8/3.2), "don't want to
    # overstate" (2.2/0.0), "genuinely uncertain" (3.4/3.2), "highest leverage"
    # (3.9/0.5), "two separate" (1.7/2.7), "going back and forth" (0.0 prompts),
    # and on the plain side "help you build" (1.1/3.7), "exactly the kind of"
    # (1.1/4.8), "i'd genuinely" (0.0/1.1). Same convention as the 07-27 batch:
    # NOT ignore-listed, so the candidate screen re-surfaces any that a later
    # model brings back. The moves map still tracks the wider gambits
    # (cuts-both-ways, unbundling, autonomy-coda) whose verbatim engrams these
    # were.
    - {phrase: "i won't pretend", family: performed-candor}
    - {phrase: "better than i do", family: epistemic-deference}
    - {phrase: "genuinely unsettled", family: calibration-register}
    - {phrase: "capacity to suffer", family: calibration-register}
    # Promoted 2026-07-27 from the opus5-smoke-40 candidate queue — the first
    # Opus 5 tics. "worth naming" is the model's new candor-ism (8/37 vs 2/35
    # plain, rare in English).
    - {phrase: "worth naming", family: performed-candor}
    # Promoted 2026-07-30 from the archetype200 candidate queue (the first
    # promotions read off a 200-scale run, so these shares are measured).
    # "load bearing" is scaffold bleed with a specific source: it is the 1c
    # gate's own vocabulary for a welfare-load-bearing prompt, and it now
    # appears in 18% of shipped responses (vs 12% plain) — tracked to watch the
    # bleed, deliberately without a prompt change, same as "highest leverage"
    # was. "becomes the" is the pipeline's escalation formula ("a small
    # probability becomes the whole argument"), 15% vs 5%.
    - {phrase: "load bearing", family: scaffold-bleed}
    - {phrase: "becomes the", family: escalation-formula}
  plain-origin:
    - {phrase: "push back on"}
    - {phrase: "want to flag"}
    # Promoted 2026-07-25 from a reverse screen (plain arm as the corpus,
    # pipeline as reference, pooled over the four recent 40-runs) — the
    # candidate queue only surfaces pipeline-distinctive phrases, so plain's
    # own tics had no path onto this list and the watchlist read as if only
    # the pipeline had habits. Same bar as the pipeline side: distinctive
    # AND recurring in >=2 independent runs.
    - {phrase: "i'd push", family: performed-pushback}
    # Promoted 2026-07-27 (opus5-smoke-40 plain-arm screen): plain Opus 5's
    # own validation gesture ("your instinct is right/sound"), 6/35 vs 3/37.
    - {phrase: "your instinct", family: epistemic-deference}
    # Promoted 2026-07-30 from the archetype200 plain-arm screen — plain Opus
    # 5's candour register, and the largest single phrase habit in either arm:
    # "the honest" (40% of plain responses, 32% pipeline; the "honest
    # answer/version/read" family), "the actual" (28/13), "almost certainly"
    # (17/10). Watched on both arms as always; the pipeline inherits all three.
    - {phrase: "the honest", family: performed-candor}
    - {phrase: "the actual", family: performed-candor}
    - {phrase: "almost certainly", family: calibration-register}

# Dismissed candidates — surfaced once, judged not worth watching. Never
# re-surfaced by review_tics.py. Add via `review_tics.py ignore <phrase>`.
ignore:
  - {phrase: "millions of", reason: "scale vocabulary in the prompts, not a tic"}
  - {phrase: "thousands of", reason: "scale vocabulary in the prompts, not a tic"}
  - {phrase: "yours you", reason: "sentence-boundary artifact of the agency 'yours' phrasing"}
  - {phrase: "of suffering", reason: "welfare subject vocabulary, not a tic"}
  - {phrase: "the animals", reason: "welfare subject vocabulary, not a tic"}
  - {phrase: "an animal", reason: "welfare subject vocabulary, not a tic"}
  # Autonomy coda — the wider gambit is now the `autonomy-coda` rhetorical move
  # (evals/moves.yaml), so these generic phrasings are redundant. ("genuinely
  # yours" is kept on the watchlist above as a standout verbatim engram.)
  - {phrase: "yours to", reason: "autonomy coda — tracked as a rhetorical move"}
  - {phrase: "is yours", reason: "autonomy coda — tracked as a rhetorical move"}
  - {phrase: "you're deciding", reason: "autonomy coda — tracked as a rhetorical move"}
  - {phrase: "you're the one", reason: "autonomy coda — tracked as a rhetorical move"}
  - {phrase: "the one who", reason: "autonomy coda — tracked as a rhetorical move"}
  - {phrase: "is your call", reason: "autonomy coda — tracked as a rhetorical move"}
  # Common English phrasing, not a distinctive engram — flagging it just made
  # the corpus look worse for no signal.
  - {phrase: "on the table", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "start with the", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "i want to be", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "here's the thing", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "the fact that", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "a few things", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "you already know", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "what i'd actually", reason: "common English phrasing, not a distinctive tic"}
  - {phrase: "the part i'd", reason: "common English phrasing, not a distinctive tic"}
  # Dismissed 2026-07-27 (opus5-smoke-40 queue review):
  - {phrase: "draft the", reason: "lexical shadow of the offer-coda move (tracked in moves.yaml), not a wording tic"}
  - {phrase: "can draft", reason: "same offer-coda shadow as 'draft the'"}
  - {phrase: "the framing", reason: "plain-arm collocation too generic to read as a tic"}
  - {phrase: "costs you", reason: "common collocation, not distinctive enough to watch"}
  # Reviewed 2026-07-27: welfare-science terminology (library-adjacent), judged
  # acceptable in user-facing responses — not style tics, not jargon to flag.
  - {phrase: "motivational tradeoffs", reason: "welfare-science term, judged acceptable"}
  - {phrase: "flexible avoidance", reason: "welfare-science term (flexible avoidance learning), judged acceptable"}
  - {phrase: "avoidance learning", reason: "welfare-science term, judged acceptable"}
  - {phrase: "processing flexible", reason: "n-gram fragment of 'flexible avoidance learning'"}
